name: LMLM Runtime v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  numpy-runtime-and-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional tensor dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Run runtime and training tests
        run: python -m unittest tests.test_numpy_backend tests.test_tiny_training -v
